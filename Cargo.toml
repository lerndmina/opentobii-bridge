[workspace]
resolver = "2"
members = ["crates/opentobii", "crates/opentobii-core", "crates/opentobii-proto", "crates/opentobii-sign"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/lerndmina/opentobii-bridge"

[workspace.lints.rust]
# "deny", not "forbid": the code Slint generates for the window allows it
# locally. Nothing written in this repository uses unsafe.
unsafe_code = "deny"

[profile.release]
# Symbols are not shipped: it takes the binary from 32 MB to 25 MB.
strip = true
