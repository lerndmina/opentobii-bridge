name: Release

# Push a tag like v0.1.0 to build the packages and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.1"

jobs:
  release:
    # An older Ubuntu, so the binary runs on distros with an older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
        env:
          # Fail instead of shipping a binary with no prefix helper inside.
          OPENTOBII_REQUIRE_HELPER: "1"
      - name: Packaging tools
        run: cargo install --locked cargo-generate-rpm@0.21.1 cargo-deb@3.8.0
      - name: Packages
        run: |
          mkdir -p dist
          cargo generate-rpm -p crates/opentobii -o dist/
          cargo deb -p opentobii --no-build -o dist/
          packaging/make-tarball.sh "$VERSION" dist
          # The bare program, for the built-in updater. Its name carries the
          # version so a signed list from one release cannot stand in for
          # another.
          cp target/release/opentobii "dist/opentobii-$VERSION-x86_64-linux"
          cd dist
          sha256sum * > SHA256SUMS
          ls -la
      - name: Sign the checksums
        run: cargo run --release --locked -p opentobii-sign -- sign dist/SHA256SUMS
        env:
          OPENTOBII_SIGNING_KEY: ${{ secrets.OPENTOBII_SIGNING_KEY }}
      - name: Check the signature with the shipped program's own key
        run: cargo test --release --locked -p opentobii --lib release_signature -- --ignored
        env:
          OPENTOBII_RELEASE_DIR: ${{ github.workspace }}/dist
      - name: Publish
        run: |
          # Only a version with a suffix, such as 1.0.0-rc1, is a pre-release.
          # The updater follows GitHub's "latest release", which skips those.
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "opentobii $VERSION" --generate-notes $flags
        env:
          GH_TOKEN: ${{ github.token }}
